name: dog_sheep_player
description: "DogSheep音乐 - Bilibili 大会员 Hi-Res 音乐播放器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 音频播放
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18

  # 状态管理
  flutter_riverpod: ^2.4.9

  # 网络请求
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # 本地存储
  path_provider: ^2.1.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # 图片缓存
  cached_network_image: ^3.3.1

  # 路由
  go_router: ^14.1.0

  # 加密签名
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.0

  # QR 码渲染（扫码登录）
  qr_flutter: ^4.1.0

  # 触觉反馈（使用 Flutter 内置 HapticFeedback，无需额外包）
  # flutter_haptic: ^0.0.1  # 包不存在，使用 flutter/services.dart 内置方案

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1E2A3A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
